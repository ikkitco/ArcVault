<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcVault</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 class=%22mark%22 role=%22img%22 aria-label=%22ArcVault%22%3E  %3Cdefs%3E%3Cmask id=%22fvk%22 maskUnits=%22userSpaceOnUse%22 x=%220%22 y=%220%22 width=%22100%22 height=%22100%22%3E    %3Crect width=%22100%22 height=%22100%22 fill=%22%23fff%22/%3E%3Cpath d=%22M8 67 Q50 43 92 67%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%228%22/%3E%3C/mask%3E%3C/defs%3E  %3Cpath d=%22M50 2 L91.6 26 L91.6 74 L50 98 L8.4 74 L8.4 26 Z%22 fill=%22%23D5AE58%22/%3E  %3Cpath d=%22M50 12 L76 90 L64 90 L50 48 L36 90 L24 90 Z%22 fill=%22%230F1218%22 mask=%22url%28%23fvk%29%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: summary strip on top, filter rail on the left, one dense sortable table (or set table) filling the rest. */
:root {
  /* ArcVault brand (dark, default). Vault Gold is brand-only: logo, title, one accent line.
     Interactive = Arc Blue. Card data only ever uses the rarity / legality colours below. */
  --bg: #0F1218; --panel: #171C24; --ink: #E7EAF0; --muted: #9AA3B5; --line: #262D3A;
  --accent: #5A8DFF; --accent-ink: #0F1218; --accent-soft: #1C2740; --row-hover: #1D232D;
  --brand: #D5AE58; --brand-mark: #D5AE58; --brand-arc: #F2D58C; --brand-line: linear-gradient(90deg, transparent, #D5AE58 20%, #D5AE58 80%, transparent);
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
  /* rarity + legality (semantic data colours - unchanged by the rebrand) */
  --r-common: #c9ccd4; --r-uncommon: #9fb7c6; --r-rare: #e0b54a; --r-mythic: #ff7a3d; --r-land: #8a8f99;
  --warn: #E8A33D; --ok: #49c27c; --ok-soft: #173326; --bad: #ff6b5b; --bad-soft: #3a1c1a; --na: #5d6474;
  --W: #f3ecd2; --U: #2f7fd1; --B: #9a8fa6; --R: #d2402f; --G: #2f8a4c; --C: #b9bdc6;
  color-scheme: dark;
}
:root[data-theme="light"] {
  /* warm "parchment" light theme: no pure white */
  --bg: #ECE6DA; --panel: #F6F2EA; --ink: #0F1218; --muted: #6A6458; --line: #DCD4C6;
  --accent: #2F5BD3; --accent-ink: #ffffff; --accent-soft: #E2E4EC; --row-hover: #EFE9DE;
  --brand: #9A7425; --brand-mark: #0F1218; --brand-arc: #C9A04A; --brand-line: linear-gradient(90deg, transparent, #C9A04A 20%, #C9A04A 80%, transparent);
  --r-common: #3a3f4b; --r-uncommon: #5E7584; --r-rare: #94701F; --r-mythic: #C24A17; --r-land: #7d7a72;
  --warn: #A3640E; --ok: #1f7a44; --ok-soft: #DCEBDD; --bad: #b53526; --bad-soft: #F3DCD5; --na: #9a958a;
  --B: #3b3540; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--brand-line); opacity: .55; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--ink); }
.brand svg.mark { width: 42px; height: 42px; flex: none; display: block; }
.markbtn { border: 0; background: none; padding: 0; margin: 0; cursor: default; color: inherit; border-radius: 11px; flex: none; }
/* in the ArcVault window the logo is the Export now button: a bevelled key that glows while it exports */
.in-app .markbtn { cursor: pointer; padding: 0; transition: transform .08s; }
.in-app .markbtn:hover svg.mark { filter: drop-shadow(0 0 3px rgba(255,226,150,.45)); }
.in-app .markbtn:active { transform: translateY(1px) scale(.96); }
.markbtn svg.mark { transition: filter 1.6s ease-out; }
/* exporting: the bevel drops away and the logo itself breathes a warm light */
.in-app .markbtn.busy svg.mark { animation: markglow 1.5s ease-in-out infinite; }
@keyframes markglow {
  0%, 100% { filter: drop-shadow(0 0 1px #fff4d2) drop-shadow(0 0 4px rgba(255,226,150,.55)); }
  50% { filter: drop-shadow(0 0 2px #fffaf0) drop-shadow(0 0 9px rgba(255,232,165,.95)) drop-shadow(0 0 16px rgba(255,214,120,.5)); } }
/* finished: a short white flash from the logo, then it fades back to normal */
.in-app .markbtn.flash svg.mark { transition: none; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px rgba(255,255,255,.95)) drop-shadow(0 0 22px rgba(255,255,255,.6)); }
:root[data-theme="light"].in-app .markbtn.busy svg.mark { animation-name: markglowlight; }
@keyframes markglowlight {
  0%, 100% { filter: drop-shadow(0 0 1px rgba(47,91,211,.6)) drop-shadow(0 0 4px rgba(47,91,211,.35)); }
  50% { filter: drop-shadow(0 0 2px rgba(47,91,211,.9)) drop-shadow(0 0 9px rgba(47,91,211,.6)) drop-shadow(0 0 15px rgba(90,141,255,.35)); } }
:root[data-theme="light"].in-app .markbtn.flash svg.mark { filter: drop-shadow(0 0 2px rgba(31,122,68,.7)) drop-shadow(0 0 8px rgba(31,122,68,.4)); }
:root[data-theme="light"].in-app .markbtn:hover svg.mark { filter: drop-shadow(0 0 3px rgba(47,91,211,.35)); }
/* the gold line under the header becomes a running light while an export is in progress */
header::after { transition: opacity 1.6s ease-out, filter 1.6s ease-out; }
body.exporting header::after { height: 2px; opacity: 1;
  background: linear-gradient(90deg, transparent, var(--brand) 30%, #fff6dc 50%, var(--brand) 70%, transparent) no-repeat, var(--brand-line);
  background-size: 30% 100%, 100% 100%; animation: barrun 4.5s cubic-bezier(.45, 0, .55, 1) infinite; }
@keyframes barrun { from { background-position: -45% 0, 0 0; } to { background-position: 145% 0, 0 0; } }
body.exportdone header::after { height: 2px; opacity: 1; transition: none; filter: brightness(2.2); }
@media (prefers-reduced-motion: reduce) { .in-app .markbtn.busy svg.mark { animation: none; filter: drop-shadow(0 0 6px rgba(255,232,165,.9)); } body.exporting header::after { animation: none; } }
.brand svg.word { height: 17px; width: auto; }
.brand .tagline { display: block; font: 500 10.5px/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.themebtn { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.themebtn:hover { color: var(--ink); border-color: var(--accent); }
h1 { font: 700 26px/1 var(--font-display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.source { color: var(--muted); font-size: 12.5px; }
.source b { color: var(--ink); font-weight: 600; }
.load { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.slot { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 240px; background: var(--bg); }
.slothead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.slotname { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.btn.small { padding: 2px 10px; font-size: 12.5px; }
.fname { font: 12px var(--font-mono); color: var(--muted); }
.owned .tot { color: var(--muted); font-weight: 400; margin-left: 1px; }
.fname .upd { color: var(--accent); }

/* ---- first run ---- */
body.welcome aside { display: none; }
body.welcome main { grid-template-columns: 1fr; }
body.welcome .toolbar { display: none; }
.welcomebox { max-width: 720px; margin: 48px auto; padding: 0 24px; }
.welcomebox h2 { font: 600 30px/1.1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
.welcomebox .wsub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
.wsteps { list-style: none; counter-reset: w; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.wsteps li { counter-increment: w; position: relative; padding: 16px 18px 16px 60px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.wsteps li::before { content: counter(w); position: absolute; left: 18px; top: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 15px var(--font-display); background: var(--accent-soft); color: var(--accent); }
.wsteps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.wsteps li b { font-size: 15px; }
.wsteps li p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.wstat { margin-left: 10px; font-size: 13px; }
.wstat.ok { color: var(--ok); } .wstat.wait { color: var(--warn); }
.wbtns { display: flex; gap: 10px; margin-top: 10px; }
.wprog { color: var(--accent) !important; } .werr { color: var(--warn) !important; } .wok { color: var(--ok) !important; }
.wnote { color: var(--muted); font-size: 12.5px; margin-top: 18px; text-align: center; }
.wplace, .wimport { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px 18px; margin: 0 0 14px; }
.wplace { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.wplacetext { min-width: 0; }
.wlbl { display: block; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.wplace code, .wimport code { font: 12.5px var(--font-mono); color: var(--ink); word-break: break-all; }
.wplace p, .wimport p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.wplace .wtest { color: var(--warn); }
.wimport { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.wimport b { font-size: 15px; }
.wbar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; margin-top: 10px; }
.wbar span { display: block; height: 100%; background: var(--brand); transition: width .3s; }
.wimport details { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.wimport pre { max-height: 220px; overflow: auto; background: var(--bg); padding: 8px 10px; border-radius: 6px; font: 11.5px var(--font-mono); white-space: pre-wrap; }
.wnote + .wnote { margin-top: 6px; } .wnote.fan { font-size: 11px; opacity: .8; margin-top: 14px; }
/* ---- the big auto-export switch (ArcVault window only) ---- */
.statsbar { display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); }
.statsbar .stats { flex: 1; min-width: 0; border-bottom: 0; }
.autosw { display: none; flex: none; width: 270px; flex-direction: column; justify-content: center; gap: 7px; padding: 8px 16px; border-right: 1px solid var(--line); }
.swrow { display: flex; align-items: center; gap: 12px; }
.swrow .lbl { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
/* the status line never wraps: if it's too long it slides along its rail and back */
.swrail { overflow: hidden; white-space: nowrap; height: 18px; line-height: 18px; font: 600 13px/18px var(--font-display); text-transform: uppercase; letter-spacing: .08em; mask-image: linear-gradient(90deg, #000 92%, transparent); }
.swrail:not(.moving) { mask-image: none; }
.swrail .swstate { display: inline-block; }
.swrail.moving .swstate { animation: rail var(--rail-s, 8s) ease-in-out infinite alternate; }
@keyframes rail { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift)); } }
@media (prefers-reduced-motion: reduce) { .swrail.moving .swstate { animation: none; } .swrail { text-overflow: ellipsis; } }
.in-app .autosw { display: flex; }
.in-app .statsbar .stats { padding-left: 10px; }      /* PRINTINGS lines up with the first column heading below */
.sw { position: relative; width: 54px; height: 28px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--na); transition: background .2s; flex: none; }
.sw .knob { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 2px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: left .2s; }
.sw[aria-checked="true"] .knob { left: 30px; }
.sw[aria-checked="true"] { background: var(--brand); }
.sw.st-soon, .sw.st-exporting { animation: swpulse 1.6s ease-in-out infinite; }
.sw.st-retry { background: var(--warn); }
.sw:disabled { opacity: .6; cursor: progress; }
@keyframes swpulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .sw.st-soon, .sw.st-exporting { animation: none; } }
.in-app .slot { min-width: 0; }
.swstate { font: inherit; color: var(--muted); }
.swstate.st-waiting, .swstate.st-retry { color: var(--warn); }
.swstate.st-soon, .swstate.st-exporting { color: var(--brand); }
.swstate.st-done { color: var(--ok); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.linkbtn:disabled { color: var(--muted); cursor: default; opacity: .6; }

.fname .chk { color: var(--brand); }
.fname.ok { color: var(--ok); font-weight: 600; }
.fname.warn { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
input[type=file] { display: none; }

.stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.sgroup { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-end; }
.sgroup.inv { padding-left: 22px; border-left: 1px solid var(--line); }
.stat .n .q { font: inherit; } .stat .n .sep { color: var(--na); margin: 0 2px; font-weight: 400; }
.stat .n .na { color: var(--na); font-weight: 400; }
.q.r-mythic { color: var(--r-mythic); } .q.r-rare { color: var(--r-rare); } .q.r-uncommon { color: var(--r-uncommon); } .q.r-common { color: var(--r-common); }
@media (max-width: 820px) { .sgroup.inv { padding-left: 0; border-left: 0; } }
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat .n { font: 600 21px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 11px; line-height: 1; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.stat.r-mythic .n { color: var(--r-mythic); } .stat.r-new .n { color: var(--ok); } .stat.r-rare .n { color: var(--r-rare); }
.stat.r-uncommon .n { color: var(--r-uncommon); } .stat.r-common .n { color: var(--r-common); }

main { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
aside { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
aside::-webkit-scrollbar { display: none; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.appopt { display: none !important; } .in-app .appopt { display: flex !important; }
.fgroup > label:not(.check), .fgroup > .lbl { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fgroup input[type=search], .fgroup select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; user-select: none; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.pip { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font: 600 12px var(--font-mono); }
/* rarity chips use the rarity colours when picked */
.chip[class*="rar-"][aria-pressed="true"] { color: var(--bg); border-color: transparent; }
.chip.rar-mythic[aria-pressed="true"] { background: var(--r-mythic); }
.chip.rar-rare[aria-pressed="true"] { background: var(--r-rare); }
.chip.rar-uncommon[aria-pressed="true"] { background: var(--r-uncommon); }
.chip.rar-common[aria-pressed="true"] { background: var(--r-common); }
/* colour chips light up in their own colour when picked */
.chip.pip[aria-pressed="true"] { border-color: transparent; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--ink); }
.chip.col-W[aria-pressed="true"] { background: var(--W); color: #4a3d0c; }
.chip.col-U[aria-pressed="true"] { background: var(--U); color: #fff; }
.chip.col-B[aria-pressed="true"] { background: var(--B); color: #16121a; }
:root[data-theme="light"] .chip.col-B[aria-pressed="true"] { color: #fff; }
.chip.col-R[aria-pressed="true"] { background: var(--R); color: #fff; }
.chip.col-G[aria-pressed="true"] { background: var(--G); color: #fff; }
.chip.col-C[aria-pressed="true"] { background: var(--C); color: #22252b; }
.chip.col-M[aria-pressed="true"] { background: linear-gradient(135deg, #e7c25a, #c9962e); color: #3a2a06; }
.row2 { display: flex; gap: 6px; } .row2 > * { flex: 1; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }
.setlist { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 4px; }
.setlist label { display: flex; gap: 6px; align-items: baseline; padding: 2px 4px; font-size: 12.5px; cursor: pointer; border-radius: 4px; }
.setlist label:hover { background: var(--row-hover); }
.setlist code { font: 500 11px var(--font-mono); color: var(--muted); min-width: 34px; }
.setlist .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }

.content { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
.selbar[hidden] { display: none; }
.selbar .spacer { flex: 1; }
.sellbl { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.selchips { display: flex; flex-wrap: wrap; gap: 5px; }
.selchip { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.selchip code { font: 500 11px var(--font-mono); color: var(--accent); }
.selchip span { color: var(--muted); font-size: 11px; } .selchip:hover span { color: var(--bad); }
tr.pickrow { cursor: pointer; }
tr.pickrow.sel td { background: var(--accent-soft); }
tr.pickrow.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.selbox { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--na); border-radius: 3px; margin-right: 9px; vertical-align: -2px; flex: none; }
tr.pickrow:hover .selbox { border-color: var(--accent); }
tr.pickrow.sel .selbox { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--panel); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { border: 0; background: var(--panel); padding: 6px 14px; cursor: pointer; }
.tabs button { color: var(--muted); }
.tabs button:hover { color: var(--ink); }
.tabs .early { font: 600 9.5px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; padding: 2px 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; margin-left: 3px; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar .spacer { flex: 1; }
.tablewrap { flex: 1; min-height: 0; overflow: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
thead th { position: sticky; top: 0; background: var(--panel); text-align: left; font: 600 13px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
thead th:hover { color: var(--ink); }

<script>
// Theme: ArcVault is dark by default; light only when chosen (remembered per browser).
(() => {
  const root = document.documentElement, btn = document.getElementById("themebtn");
  let t = "dark"; try { t = localStorage.getItem("arcvault:theme") || "dark"; } catch {}
  const apply = v => { if (v === "light") root.dataset.theme = "light"; else delete root.dataset.theme;
    btn.setAttribute("aria-label", v === "light" ? "Switch to dark theme" : "Switch to light theme"); };
  apply(t);
  btn.onclick = () => { t = t === "light" ? "dark" : "light"; apply(t); try { localStorage.setItem("arcvault:theme", t); } catch {}
    if (typeof onThemeChange === "function") onThemeChange(); };
})();
const EMBEDDED = null;
const EMBEDDED_LABEL = null;

const RARITY_ORDER = { "Mythic": 5, "Rare": 4, "Uncommon": 3, "Common": 2, "Basic Land": 1, "": 0 };
const RARITIES = ["Mythic", "Rare", "Uncommon", "Common"];
const COLORS = ["W", "U", "B", "R", "G", "C", "M"];
const COLOR_TIP = { W: "White", U: "Blue", B: "Black", R: "Red", G: "Green", C: "Colourless", M: "Multicolour (2+)" };
const TYPES = ["Creature", "Instant", "Sorcery", "Enchantment", "Artifact", "Planeswalker", "Land", "Battle", "Kindred"];
const KNOWN_FORMATS = ["Standard", "Alchemy", "Explorer", "Historic", "Timeless", "Pioneer", "Standard Brawl", "Brawl"];
const DEFAULT_COLS = ["Standard", "Alchemy", "Historic", "Timeless"];
const MAX_ROWS = 600;

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("mtgaview:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mtgaview:" + k, JSON.stringify(v)); } catch {} },
};

// Big CSVs (the full card list is several MB) go to IndexedDB; localStorage is too small.
const bigStore = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("mtgaview", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }

  async get(k) { try { const db = await this.open(); return await new Promise((res) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }); } catch { return null; } },

const STAT_TIPS = {
  count: "Rows matching the filters on the left (the same on every tab)",
  usable: "Copies a deck can use: up to 4 per card name, from any printing",
  playsets: "Cards you have 4 usable copies of, from any printing",
  new: "Copies gained since the previous export",
  rarity: "Mythic / rare / uncommon / common rows matching the filters",
  get gold() { return `From ${fn("inventory")} (slot 2)`; },
  get gems() { return `From ${fn("inventory")} (slot 2)`; },
  get wildcards() { return `Mythic / rare / uncommon / common wildcards, from ${fn("inventory")} (slot 2)`; },

// File slots: the file name turns green once that file is loaded
function setSlot(kind, cls, text, tip) {

const shortWhen = () => new Date().toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

let inventory = null;   // latest known values from mtga_inventory.csv
// File names as this copy writes them: mtga_... in a plain folder, arc_... in an installed copy.
const FN_DEFAULT = { collection: "mtga_collection.csv", collection_full: "mtga_collection_full.csv", inventory: "mtga_inventory.csv" };

let inventoryRows = [];  // every row: the history
const WC = [["Mythic", "Mythic Wildcards"], ["Rare", "Rare Wildcards"], ["Uncommon", "Uncommon Wildcards"], ["Common", "Common Wildcards"]];
function loadInventory(text, remember, fileName) {

const MV_CHIPS = ["0", "1", "2", "3", "4", "5", "6", "7+"];
let cards = [], formats = [], setsInfo = new Map(), fullMode = false, hasNew = false, hasMV = false;
let state = {
  tab: "cards", own: "owned", onlynew: false, mv: new Set(), mysets: true, q: "", rar: new Set(), col: new Set(), colormode: "any", types: new Set(),
  legalfmt: "", legalstatus: "Legal", minowned: 0, group: false, hidealch: false, hidebasic: true,
  sets: new Set(), setq: "", cols: new Set(store.get("cols", DEFAULT_COLS)),

// ---------- CSV ----------
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = "", i = 0, q = false;
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = [];
    } else field += c;
    i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift() || [];
  return { head, rows: rows.map(r => Object.fromEntries(head.map((h, j) => [h, r[j] ?? ""]))) };
}
function toCSV(head, rows) {
  const esc = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [head.map(esc).join(","), ...rows.map(r => head.map(h => esc(r[h])).join(","))].join("\n");
}

function load(text, label, remember, fileName, when) {
  when = when || (remember ? shortWhen() : "");
  const { head, rows } = parseCSV(text);
  if (!head.includes("Name") || !head.includes("Owned")) { toast("That file doesn't look like an ArcVault collection export (no Name/Owned columns)."); return; }
  formats = KNOWN_FORMATS.filter(f => head.includes(f));
  fullMode = head.includes("In Set");
  hasNew = head.includes("New");
  hasMV = head.includes("Mana Value");
  if (!rows.some(r => r["Set Released"])) state.sort = { key: "Set", dir: 1 };
  cards = rows.map(r => {
    const type = r["Type"] || "";
    const main = type.split("—")[0];
    const colors = (r["Colors"] || "").replace(/[^WUBRG]/g, "").split("").filter(Boolean);
    return {
      ...r,
      _owned: parseInt(r["Owned"], 10) || 0,
      _any: r["Owned (any printing)"] !== undefined && r["Owned (any printing)"] !== "" ? parseInt(r["Owned (any printing)"], 10) || 0 : (parseInt(r["Owned"], 10) || 0),
      _inset: r["In Set"] === "Yes",
      _new: parseInt(r["New"], 10) || 0,
      _mv: r["Mana Value"] === undefined || r["Mana Value"] === "" ? null : parseFloat(r["Mana Value"]),
      _rar: RARITY_ORDER[r["Rarity"]] ?? 0,
      _types: TYPES.filter(t => new RegExp("\\b" + t + "\\b").test(main)),
      _colors: colors,
      _alch: r["Rebalanced (Alchemy)"] === "Yes" || /^A-/.test(r["Name"] || ""),
      _basic: r["Rarity"] === "Basic Land" || /^Basic\b/.test(type),
      _num: parseInt(r["Collector Number"], 10) || 0,
      _search: [r["Name"], r["Alternate Name"], type, r["Oracle Text"], r["Mechanics"], r["Keywords"]].filter(Boolean).join(" ").toLowerCase(),
    };
  });
  // copies of each card across all its printings, for the Owned column's "/total"
  const totals = new Map();
  for (const c of cards) totals.set(c["Name"], (totals.get(c["Name"]) || 0) + c._owned);
  for (const c of cards) c._total = totals.get(c["Name"]);
  setsInfo = new Map();
  for (const c of cards) {
    const k = c["Set"] || "?";
    if (!setsInfo.has(k)) setsInfo.set(k, { code: k, name: c["Set Name"] || "", released: c["Set Released"] || "", n: 0 });
    const si = setsInfo.get(k);
    if (c._owned > 0) si.n++;
    if (!si.name && c["Set Name"]) { si.name = c["Set Name"]; si.released = c["Set Released"] || si.released; }
  }
  if (!fullMode) state.own = "owned";
  state.sets = new Set([...state.sets].filter(s => setsInfo.has(s)));
  if (![...state.cols].some(c => formats.includes(c))) state.cols = new Set(DEFAULT_COLS.filter(f => formats.includes(f)));
  const noLegal = formats.length ? "" : " No set names or legality in this file: re-run the exporter.";
  if (remember) { bigStore.set("csv", text); bigStore.set("label", label); bigStore.set("colName", fileName || ""); bigStore.set("colWhen", shortWhen()); }
  if (fileName) setSlot("col", "ok", `✓ ${fileName}${when ? " · " + when : ""}`,
      (fullMode ? "Full card list: completion, missing cards and deck check all work." : `Owned cards only. For set completion, Missing and deck-check rarities, load ${fn("collection_full")}.`) + noLegal);
  else setSlot("col", "warn", `preview · ${String(label || "").replace(/^Preview:\s*(your export from\s*)?/i, "") || "built in"} · load yours`,
      `This page carries a preview of your collection. Load ${fn("collection_full")} to use your latest export.` + noLegal);
  if (fileName && !fullMode) $("name-col").textContent += " (owned only)";
  buildFilters(); render();
}

// ---------- filters UI ----------
function chip(container, value, label, set, title, extraClass) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (extraClass ? " " + extraClass : "");
  b.textContent = label; if (title) b.title = title;
  b.setAttribute("aria-pressed", set.has(value));
  b.onclick = () => { set.has(value) ? set.delete(value) : set.add(value); b.setAttribute("aria-pressed", set.has(value)); if (set === state.cols) store.set("cols", [...set]); state.showAll = false; render(); };
  container.appendChild(b);
}
function buildFilters() {
  const fr = $("f-rarity"); fr.innerHTML = ""; RARITIES.forEach(r => chip(fr, r, r, state.rar, null, "rar-" + r.toLowerCase()));
  const fc = $("f-color"); fc.innerHTML = ""; COLORS.forEach(c => chip(fc, c, c, state.col, COLOR_TIP[c], "pip col-" + c));
  const fm = $("f-mv"); fm.innerHTML = "";
  if (hasMV) MV_CHIPS.forEach(v => chip(fm, v, v, state.mv));
  else fm.innerHTML = `<span class="note">Needs exporter v1.6 or later.</span>`;
  for (const b of $("f-own").querySelectorAll("button")) {
    b.disabled = !fullMode && b.dataset.v !== "owned";
    b.setAttribute("aria-pressed", b.dataset.v === state.own);
  }
  $("own-note").textContent = fullMode ? "" : `Missing and All need ${fn("collection_full")} (exporter v1.7+).`;
  $("onlynew").disabled = !hasNew;
  const ft = $("f-type"); ft.innerHTML = ""; TYPES.forEach(t => { if (cards.some(c => c._types.includes(t))) chip(ft, t, t, state.types); });
  const fcol = $("f-cols"); fcol.innerHTML = "";
  if (formats.length) formats.forEach(f => chip(fcol, f, f, state.cols));
  else fcol.innerHTML = `<span class="note">Your CSV has no legality data yet. Run the exporter v1.4 or later.</span>`;
  const lf = $("legalfmt"); lf.innerHTML = `<option value="">Any format</option>` + formats.map(f => `<option${f === state.legalfmt ? " selected" : ""}>${f}</option>`).join("");
  lf.disabled = !formats.length; $("legalstatus").disabled = !formats.length;

}
function buildSetList() {

  for (const s of list) {
    if (q && !(s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))) continue;
    if (state.own === "owned" && !s.n && !state.sets.has(s.code)) continue;
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" ${state.sets.has(s.code) ? "checked" : ""}> <code>${esc(s.code)}</code> <span>${esc(s.name || "—")}</span> <span class="cnt">${s.n}</span>`;
    l.querySelector("input").onchange = (e) => { e.target.checked ? state.sets.add(s.code) : state.sets.delete(s.code); state.showAll = false; render(); };
    box.appendChild(l);

}

// ---------- filtering ----------
function colorMatch(c) {
  if (!state.col.size) return true;
  const sel = state.col, cs = c._colors;
  const wantC = sel.has("C"), wantM = sel.has("M");
  const selCols = [...sel].filter(x => "WUBRG".includes(x));
  if (state.colormode === "any") {
    return (wantC && cs.length === 0) || (wantM && cs.length >= 2) || cs.some(x => sel.has(x));
  }
  if (cs.length === 0) return wantC;
  if (wantM && cs.length < 2) return false;
  if (state.colormode === "only") return cs.every(x => sel.has(x));
  return cs.length === selCols.length && cs.every(x => sel.has(x));
}
function mvMatch(c) {
  if (!state.mv.size) return true;
  if (c._mv === null) return false;
  return state.mv.has(c._mv >= 7 ? "7+" : String(Math.floor(c._mv)));
}
function ownMatch(c) {
  if (state.own === "owned") return c._owned > 0;
  if (state.own === "missing") return c._inset && c._any === 0;
  return c._owned > 0 || c._inset;
}
// which-cards filters, shared by both tabs (ownership is separate)
function cardMatch(c, q) {
  return (!q || c._search.includes(q)) &&
    (!state.rar.size || state.rar.has(c["Rarity"])) &&
    (!state.types.size || c._types.some(t => state.types.has(t))) &&
    (!state.hidealch || !c._alch) &&

    ownMatch(c) && (!state.onlynew || c._new > 0) && cardMatch(c, q) &&
    (allSets || !state.sets.size || state.sets.has(c["Set"])));

    const m = new Map();
    for (const c of out) {
      const g = m.get(c["Name"]);
      if (!g) m.set(c["Name"], { ...c, _prints: 1, _setsList: [c["Set"]], _owned: c._owned, _new: c._new });
      else {
        g._prints++; g._owned += c._owned; g._new += c._new; if (!g._setsList.includes(c["Set"])) g._setsList.push(c["Set"]);

      }

// ---------- rendering ----------
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

  if (!c._colors.length) return `<span class="pips"><span class="pipdot C" title="Colourless">C</span></span>`;
  return `<span class="pips">${c._colors.map(x => `<span class="pipdot ${x}" title="${COLOR_TIP[x]}">${x}</span>`).join("")}</span>`;
}
function rarity(r) { return r ? `<span class="rar ${r.split(" ")[0]}">${esc(r)}</span>` : ""; }
function legal(v) {
  if (!v) return `<span class="lg no" title="Not found on Scryfall">·</span>`;
  if (v === "Not legal") return `<span class="lg no">—</span>`;

function cardColumns() {
  const cols = [
    { key: "Name", label: "Card", sort: c => (c["Name"] || "").toLowerCase(), cell: c => `<span class="cn" data-cn="${esc(c["Name"])}" data-aid="${esc(c["Arena ID"] || "")}">${esc(c["Name"])}</span>${c._alch ? '<span class="tag">Alchemy</span>' : ""}${c["Alternate Name"] ? `<span class="alt">also: ${esc(c["Alternate Name"])}</span>` : ""}` },
    { key: "Set", label: "Set", sort: c => (c["Set Name"] || c["Set"] || "").toLowerCase(), cell: c => `<span class="setcell"><code>${esc(c["Set"])}</code>${esc(c["Set Name"] || "")}</span>${state.group && c._prints > 1 ? `<span class="alt">${c._prints} printings: ${esc(c._setsList.join(", "))}</span>` : ""}` },
    { key: "Set Released", label: "Released", sort: c => c["Set Released"] || "", cell: c => `<span class="mono">${esc(c["Set Released"] || "")}</span>`, cls: "mono" },
  ];
  if (!state.group) cols.push({ key: "Collector Number", label: "#", sort: c => c._num, cell: c => esc(c["Collector Number"]), cls: "num mono" });
  cols.push(
    { key: "Rarity", label: "Rarity", sort: c => c._rar, cell: c => rarity(c["Rarity"]) },
    { key: "Colors", label: "Colour", sort: c => c._colors.length ? c._colors.length * 10 + "WUBRG".indexOf(c._colors[0]) : 0, cell: pips },
    { key: "Type", label: "Type", sort: c => (c["Type"] || "").toLowerCase(), cell: c => esc(c["Type"]) },
  );
  if (hasMV) cols.push({ key: "Mana Value", label: "Cost", sort: c => c._mv ?? -1, defaultDir: 1,
    cell: c => c._mv === null ? "" : `<span class="cost">${esc(c["Mana Cost"] || "")}<span class="mv">${c._mv}</span></span>` });
  cols.push({ key: "Owned", label: "Owned", sort: c => c._owned, cls: "num", cell: c => {
    // this printing / all printings of the card (total in grey)
    const tot = c._total || 0;
    const tip = `${c._owned} of this printing · ${tot} across all printings` + (tot > 4 ? ` (a deck can use 4)` : "");
    const n = `<span class="owned${c._owned >= 4 ? " full" : ""}${c._owned ? "" : " zero"}" title="${tip}">${c._owned}<span class="tot">/${tot}</span></span>`;
    return n + (c._new > 0 ? `<span class="newb" title="New since the last export">+${c._new}</span>` : ""); } });
  for (const f of formats) if (state.cols.has(f)) cols.push({ key: f, label: f, sort: c => ({ "Legal": 3, "Restricted": 2, "Banned": 1, "Not legal": 0 }[c[f]] ?? -1), cell: c => legal(c[f]) });

}

function render() {
  const wrap = $("tablewrap");
  if (!cards.length) {
    if (IN_APP && window.pywebview) { $("stats").innerHTML = ""; $("count").textContent = ""; return renderWelcome(); }
    wrap.innerHTML = `<div class="empty">Load <code>${fn("collection")}</code> from your ArcVault folder to see your collection.</div>`;
    $("stats").innerHTML = ""; $("count").textContent = ""; return;
  }
  const rows = filtered();
  renderStats(rows);
  renderSelbar();
  if (state.tab === "deck") return renderDeck();
  if (state.tab === "history") return renderHistory();
  if (state.tab === "next") return renderNext();
  if (state.tab === "engines") return renderEngines();
  state.tab === "cards" ? renderCards(rows) : renderSets(filtered(true));
}

// One stats strip, identical on every tab: same tiles, same order. Numbers follow
// the filters on the left (which apply to all tabs); tiles that don't apply show "—".
function renderStats(rows) {
  const missingMode = state.own === "missing";
  const by = r => rows.filter(c => c["Rarity"] === r).length;
  const copies = rows.reduce((a, c) => a + c._owned, 0);
  const sets = new Set(rows.map(c => c["Set"])).size;
  // usable = copies a deck can use: per card name, any printing, up to 4
  const perName = new Map();
  for (const c of rows) perName.set(c["Name"], (perName.get(c["Name"]) || 0) + c._owned);
  let usable = 0, playsets = 0;
  for (const n of perName.values()) { usable += Math.min(n, 4); if (n >= 4) playsets++; }
  const fresh = rows.reduce((a, c) => a + c._new, 0);
  const dash = `<span class="na">—</span>`;
  const fmt = n => Number(n).toLocaleString();
  const quad = vals => vals.map((v, i) => `<span class="q ${["r-mythic", "r-rare", "r-uncommon", "r-common"][i]}">${v}</span>`).join(`<span class="sep">/</span>`);
  const countLabel = missingMode ? "missing cards" : state.group ? "cards" : "printings";
  const left = [
    [fmt(missingMode ? perName.size : rows.length), countLabel, "count"],
    [missingMode ? dash : fmt(copies), "copies", "copies"],
    [missingMode ? dash : fmt(usable), "usable", "usable"],
    [missingMode ? dash : fmt(playsets), "playsets", "playsets"],
    [fmt(sets), "sets", "sets"],
    [!hasNew || missingMode ? dash : fmt(fresh), "new", fresh && !missingMode ? "new r-new" : "new"],
    [quad(["Mythic", "Rare", "Uncommon", "Common"].map(r => fmt(by(r)))), "by rarity", "rarity"],
  ];
  const inv = inventory;
  const wcv = k => inv && inv[k] !== "" && inv[k] !== undefined ? fmt(inv[k]) : "?";
  const right = [
    [inv ? fmt(inv["Gold"] || 0) : dash, "gold", "gold"],
    [inv ? fmt(inv["Gems"] || 0) : dash, "gems", "gems"],
    [inv ? quad(WC.map(([, k]) => wcv(k))) : dash, "wildcards", "wildcards"],
    [inv && parseFloat(inv["Vault Progress"]) > 0 ? inv["Vault Progress"] + "%" : dash, "vault", "vault"],
  ];
  const hiddenBasics = state.hidebasic && !missingMode ? cards.filter(c => c._basic && c._owned > 0).length : 0;
  const tipFor = key => key === "count" && hiddenBasics ? `${STAT_TIPS.count}. Basic lands are hidden (${hiddenBasics.toLocaleString()} owned printings): untick "Hide basic lands" to include them.` : STAT_TIPS[key];
  const tile = ([n, l, key]) => `<div class="stat t-${key.split(" ")[0]}${key.includes("r-new") ? " r-new" : ""}"${tipFor(key) ? ` title="${tipFor(key)}"` : ""}><span class="n">${n}</span><span class="l">${l}</span></div>`;
  $("stats").innerHTML = `<div class="sgroup">${left.map(tile).join("")}</div><div class="sgroup inv">${right.map(tile).join("")}</div>`;
}

function sortRows(rows, cols, s) {
  const col = cols.find(c => c.key === s.key) || cols[0];
  const nameKey = c => (c["Name"] || c.name || "").toLowerCase();
  return rows.slice().sort((a, b) => {
    const va = col.sort(a), vb = col.sort(b);
    const d = va < vb ? -1 : va > vb ? 1 : 0;
    return d * s.dir || (nameKey(a) < nameKey(b) ? -1 : nameKey(a) > nameKey(b) ? 1 : 0);
  });
}
function header(cols, s, onSort) {
  const tr = document.createElement("tr");
  for (const c of cols) {
    const th = document.createElement("th");
    th.textContent = c.label; th.scope = "col"; th.tabIndex = 0;
    if (c.cls && c.cls.includes("num")) th.className = "num";
    if (s.key === c.key) th.setAttribute("aria-sort", s.dir > 0 ? "ascending" : "descending");
    const go = () => { if (s.key === c.key) s.dir = -s.dir; else { s.key = c.key; s.dir = c.defaultDir || (["Owned", "Rarity", "Set Released", "released", "n", "copies"].includes(c.key) || formats.includes(c.key) ? -1 : 1); } onSort(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    tr.appendChild(th);
  }

}

function renderCards(rows) {
  const cols = cardColumns();
  const sorted = sortRows(rows, cols, state.sort);
  currentExport = { head: null, rows: sorted };
  const shown = state.showAll ? sorted : sorted.slice(0, MAX_ROWS);
  $("count").textContent = state.own === "missing"
    ? `${rows.length.toLocaleString()} missing (one row per set the card is in)`
    : `${rows.length.toLocaleString()} ${state.group ? "cards" : "printings"} match`;

  const rank = e => {
    const c = ti.get(e.k) || ti.get(e.k.replace(/^a-/, ""));
    const type = FREE.has(e.k) ? "Land" : (c?.["Type"] || "").split("//")[0];
    const g = TIDY_ORDER.findIndex(x => type.includes(x));
    return [g < 0 ? 6 : (type.includes("Land") ? 99 : g), FREE.has(e.k) ? 1 : 0, c?._mv ?? 99, e.rest.toLowerCase()];
  };

  const want = ["commander", "companion", "deck", "sideboard", "maybeboard"].filter(x => secs.has(x)).concat(order.filter(x => !["commander", "companion", "deck", "sideboard", "maybeboard"].includes(x)));

  }

}

  const feeds = byRule(c._pay, "feeds"), pays = byRule(c._en, "pays");
  const sortC = (a, b) => (RARITY_ORDER[b["Rarity"]] || 0) - (RARITY_ORDER[a["Rarity"]] || 0) || ownedOf(b) - ownedOf(a) || a["Name"].localeCompare(b["Name"]);
  const col = (groups, title, sub, sentence) => {
    const total = new Set(groups.flatMap(g => g.others.map(o => o["Name"]))).size;
    const body = groups.length ? groups.map(g => {
      const key = c["Name"] + g.r.id + title, shown = eng.showAll[key] ? g.others : g.others.slice(0, 12);
      return `<div class="egroup"><div class="why">${sentence(g.r)}</div>${shown.sort(sortC).map(o => ecardRow(o)).join("")}
        ${g.others.length > shown.length ? `<button class="linkbtn" data-more="${esc(key)}">Show all ${g.others.length}</button>` : ""}</div>`;
    }).join("") : `<div class="eempty">Nothing in your collection matches with these filters.</div>`;
    return `<div class="ecol"><h3>${title} <span>${total} card${total === 1 ? "" : "s"} · ${sub}</span></h3>${body}</div>`;
  };
  return enginePair(c, rules) + `
    <div class="ecols">${col(feeds, "Feeds it", "enablers for this card", r => `<b>${esc(r.whyE)}</b> → ${esc(r.whyP)} <span>(this card)</span>`)}
      ${col(pays, "It pays off", "payoffs for this card", r => `${esc(r.whyE)} <span>(this card)</span> → <b>${esc(r.whyP)}</b>`)}</div>`;
}
// The picked card with its picture, plus up to 3 cards to read beside it. Words the
// matching rules found are highlighted on both cards, so you can see why they connect.
function cardPicture(c) {
  const url = cardImageUrl(c);
  return `<div class="pframe epic">${url ? `<img alt="${esc(c["Name"])}" data-src="${url}" data-alt="${esc(cardImageAlt(c))}"${picAttrs(c)}>` : ""}${cardTextFace(c)}</div>`;
}
function highlight(text, res) {
  let h = esc(text || "");
  for (const re of res) {
    try { h = h.replace(new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "gi"), m => m ? `<mark>${m}</mark>` : m); } catch { /* skip */ }
  }
  return kwify(h.replace(/<mark>([^<]*)<mark>/g, "<mark>$1")).replace(/\n/g, "<br>");
}
function pairLinks(a, b, rules) {
  // ways a and b connect: a feeds b, or b feeds a
  const out = [];
  for (const id of a._en) if (b._pay.includes(id)) out.push({ r: rules[id], from: a, to: b });
  for (const id of b._en) if (a._pay.includes(id)) out.push({ r: rules[id], from: b, to: a });
  return out;
}
function enginePair(c, rules) {
  const pool = enginePrep().pool;
  eng.compare = eng.compare.filter(n => pool.some(x => x["Name"] === n));
  const others = eng.compare.map(n => pool.find(x => x["Name"] === n));
  const resFor = (card, links) => links.flatMap(l => (l.from === card ? l.r.en.res : l.r.pay.res) || []);
  const allLinks = others.map(o => pairLinks(c, o, rules));
  const mainRes = allLinks.flatMap(ls => resFor(c, ls));
  const meta = x => `${esc(x["Type"] || "")} · ${esc(x["Mana Cost"] || "")}`;
  const slot = (x, body, cls) => `<div class="eslot ${cls}">${cardPicture(x)}<div class="einfo">${body}</div></div>`;
  return `<div class="epair">
    ${slot(c, `<div class="t"><span class="cn" data-cn="${esc(c["Name"])}" data-aid="${esc(c["Arena ID"] || "")}">${esc(c["Name"])}</span></div>
      <div class="note">${meta(c)}${(c["Mechanics"] || "").split(";").map(x => x.trim()).filter(Boolean).map(x => ` · ${esc(x)}`).join("")}</div>
      <div class="o">${highlight(c["Oracle Text"], mainRes)}</div>`, "main")}
    ${others.map((o, i) => { const ls = allLinks[i];
      return slot(o, `<div class="t2"><span class="cn" data-cn="${esc(o["Name"])}" data-aid="${esc(o["Arena ID"] || "")}">${esc(o["Name"])}</span><button type="button" class="ecmpx" data-cmp="${esc(o["Name"])}" aria-label="Remove ${esc(o["Name"])}" title="Remove">✕</button></div>
        <div class="note">${meta(o)}</div>
        <div class="why">${ls.length ? ls.map(l => `<b>${esc(l.from["Name"])}</b> ${esc(l.r.whyE.toLowerCase())} → <b>${esc(l.to["Name"])}</b> ${esc(l.r.whyP.toLowerCase())}`).join("<br>") : "No rule links these two directly."}</div>
        <div class="o">${highlight(o["Oracle Text"], resFor(o, ls))}</div>`, "cmp"); }).join("")}
    ${others.length < ENG_COMPARE_MAX ? `<div class="eslot hint"><span>Press <b>Add</b> on any card below to read it next to ${esc(c["Name"])}.${others.length ? ` Up to ${ENG_COMPARE_MAX}.` : ""}</span></div>` : ""}
  </div>`;
}
function wireEngines(pool) {
  const wrap = $("tablewrap");
  for (const b of wrap.querySelectorAll(".seg [data-m]")) b.onclick = () => { eng.mode = b.dataset.m; renderEngines(); };
  const f = $("e-fmt"); if (f) f.onchange = e => { eng.format = e.target.value; renderEngines(); };

  for (const b of wrap.querySelectorAll("[data-chip]")) b.onclick = () => {
    const x = b.dataset.chip; eng.chips.has(x) ? eng.chips.delete(x) : eng.chips.add(x);
    store.set("engChips", [...eng.chips]); renderEngines();
  };
  const cc = $("e-chipclear"); if (cc) cc.onclick = () => { eng.chips.clear(); store.set("engChips", []); renderEngines(); };
  for (const x of wrap.querySelectorAll(".epick")) x.onchange = () => {

    engKeepScroll = true; renderEngines();
  };

    const n = b.dataset.star; stars.has(n) ? stars.delete(n) : stars.add(n);
    store.set("stars", [...stars]); engKeepScroll = true; renderEngines();
  };
  const pc = $("e-pclear"); if (pc) pc.onclick = () => { eng.picked.clear(); engKeepScroll = true; renderEngines(); };
  const eb = $("e-build"); if (eb) eb.onclick = buildFromEngine;
  wireCarousel();
  for (const b of wrap.querySelectorAll("[data-more]")) b.onclick = () => { eng.showAll[b.dataset.more] = true; renderEngines(); };
  for (const n of wrap.querySelectorAll(".nm[data-card]")) n.onclick = () => { eng.mode = "card"; if (eng.card !== n.dataset.card) eng.compare = []; eng.card = n.dataset.card; eng.q = n.dataset.card; renderEngines(); };
  for (const b of wrap.querySelectorAll("[data-cmp]")) b.onclick = () => {
    const n = b.dataset.cmp, i = eng.compare.indexOf(n);
    if (i >= 0) eng.compare.splice(i, 1); else if (eng.compare.length < ENG_COMPARE_MAX) eng.compare.push(n);
    const y = wrap.scrollTop; renderEngines(); if (i < 0) wrap.scrollTo({ top: 0, behavior: "smooth" }); else wrap.scrollTop = y;
  };
  loadCardImages(wrap);
  const q = $("e-q"), dl = $("e-dl");
  if (!q) return;
  let sel = -1;
  const show = () => {
    const v = q.value.trim().toLowerCase();
    if (v.length < 2) { dl.hidden = true; return; }
    const m = pool.filter(c => c["Name"].toLowerCase().includes(v)).sort((a, b) => a["Name"].toLowerCase().indexOf(v) - b["Name"].toLowerCase().indexOf(v) || a["Name"].localeCompare(b["Name"])).slice(0, 30);
    dl.innerHTML = m.map((c, i) => `<li data-i="${i}" data-card="${esc(c["Name"])}"><span>${esc(c["Name"])}</span><span class="meta">${esc(c["Set"] || "")}</span></li>`).join("") || `<li>No owned card matches${eng.format ? ` in ${eng.format}` : ""}</li>`;
    dl.hidden = false; sel = -1;
    for (const li of dl.querySelectorAll("li[data-card]")) li.onmousedown = e => { e.preventDefault(); pick(li.dataset.card); };
  };
  const pick = name => { if (eng.card !== name) eng.compare = []; eng.card = name; eng.q = name; renderEngines(); };
  q.oninput = show;
  q.onkeydown = e => {
    const items = [...dl.querySelectorAll("li[data-card]")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(items.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1))); items.forEach((li, i) => li.classList.toggle("on", i === sel)); }
    else if (e.key === "Enter" && items.length) { e.preventDefault(); pick(items[Math.max(sel, 0)].dataset.card); }
    else if (e.key === "Escape") dl.hidden = true;
  };
  q.onblur = () => setTimeout(() => dl.hidden = true, 150);
  if (eng.mode === "card" && !eng.card) q.focus();
}

// Theme strip: 3 rows, scrolls sideways. Arrows page through it; it also moves on by
// itself every few seconds, pausing while the mouse or focus is on it.
let carTimer = null;
const CAR_MS = 7000;
function wireCarousel() {
  clearInterval(carTimer); carTimer = null;
  const tr = $("ethemes"); if (!tr) return;
  const car = tr.parentElement, btns = car.querySelectorAll(".ecarbtn");
  tr.scrollLeft = eng.scroll || 0;
  const step = () => { const t = tr.querySelector(".etheme"); return t ? t.offsetWidth + 10 : 260; };
  const page = () => Math.max(1, Math.floor(tr.clientWidth / step())) * step();
  const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  const ends = () => { const max = tr.scrollWidth - tr.clientWidth - 2;
    btns[0].disabled = tr.scrollLeft <= 2; btns[1].disabled = tr.scrollLeft >= max; car.classList.toggle("fits", max <= 0); };
  const go = dir => {
    const max = tr.scrollWidth - tr.clientWidth;
    let to = tr.scrollLeft + dir * page();
    if (dir > 0 && tr.scrollLeft >= max - 2) to = 0;                 // wrap round at the end
    tr.scrollTo({ left: Math.max(0, Math.min(max, to)), behavior: smooth });
  };
  let paused = false;
  const start = () => { clearInterval(carTimer); carTimer = setInterval(() => {
    if (state.tab !== "engines" || !document.body.contains(tr)) { clearInterval(carTimer); carTimer = null; return; }
    if (!paused && !eng.paused && !document.hidden && tr.scrollWidth > tr.clientWidth + 2) go(1);
  }, CAR_MS); };
  btns.forEach(b => b.onclick = () => { go(+b.dataset.dir); start(); });
  const pz = $("e-pause");
  if (pz) pz.onclick = () => {
    eng.paused = !eng.paused; store.set("engPaused", eng.paused);
    pz.setAttribute("aria-pressed", eng.paused); pz.title = `${eng.paused ? "Resume" : "Pause"} the theme strip`;
    toast(eng.paused ? "Theme strip paused" : "Theme strip moving again"); start();
  };
  car.onmouseenter = car.onfocusin = () => paused = true;
  car.onmouseleave = car.onfocusout = () => paused = false;
  tr.onscroll = () => { eng.scroll = tr.scrollLeft; ends(); };
  ends(); start();
}

function readFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    if (loadInventory(r.result, true, f.name)) return toast(`Loaded ${f.name}: gold, gems and wildcards`);
    load(r.result, `${f.name} · loaded ${new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}`, true, f.name); toast(`Loaded ${f.name}`);
  };
  r.readAsText(f, "utf-8");
}
function readFiles(list) {

  const fs = [...list].sort((a, b) => /inventory/i.test(a.name) - /inventory/i.test(b.name));

  return new Promise(res => {

  return `<div class="wplace">
    <div class="wplacetext"><span class="wlbl">Your files are kept in</span><code>${esc(w.data_dir)}</code>
      ${w.synced ? `<p>${esc(w.synced)} syncs this folder, so a copy is also kept online and on your other PCs. To keep your files on this PC only, choose another folder.</p>` : ""}
      ${w.sandbox ? `<p class="wtest">Test sandbox: nothing outside the test folder is touched.</p>` : ""}</div>
    <button type="button" class="btn small" id="w-place" ${imp.state === "running" ? "disabled" : ""}>Change…</button>
  </div>`;
}
function importHtml() {
  const w = appWhere;
  if (!w || w.mode !== "installed") return "";
  const c = (imp.plan || {}).counts || {};
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const what = [c.files && plural(c.files, "file", "files"), c.snapshots && plural(c.snapshots, "snapshot", "snapshots"),
    c.changes && plural(c.changes, "change list", "change lists"), c.exports && plural(c.exports, "site export", "site exports"),
    (c.cache || c.window) && "card data and window settings"].filter(Boolean);
  const src = imp.src ? `<code>${esc(imp.src)}</code>` : "";
  let body;
  if (imp.state === "idle")
    body = `<b>Used ArcVault before?</b><p>Bring in your collection history from your old ArcVault folder.</p>
      <div class="wbtns"><button type="button" class="btn" id="w-imp-pick">Bring in your history…</button></div>`;
  else if (imp.state === "planning")
    body = `<b>Used ArcVault before?</b><p class="wprog">Looking in ${src}…</p>`;
  else if (imp.state === "error")
    body = `<b>Bring in your history</b><p class="werr">${esc(imp.error || "That didn't work.")}</p>
      <div class="wbtns"><button type="button" class="btn" id="w-imp-pick">Choose another folder…</button></div>`;
  else if (imp.state === "ready")
    body = `<b>Used ArcVault before? Bring in your history.</b>
      <p>Found your old folder: ${src}</p>
      <p>${what.length ? esc(what.join(", ")) + "." : "Nothing new to copy."} ${c.kept ? `${c.kept} newer file${c.kept > 1 ? "s" : ""} here will be kept.` : ""}
        Copied, not moved: your old folder stays exactly as it is.</p>
      <div class="wbtns"><button type="button" class="btn primary" id="w-imp-go" ${imp.plan.total ? "" : "disabled"}>Bring in your history</button>
        <button type="button" class="btn" id="w-imp-pick2">Choose another folder…</button></div>`;
  else if (imp.state === "running") {
    const pct = imp.total ? Math.round(imp.done / imp.total * 100) : 0;
    body = `<b>Bringing in your history…</b>
      <div class="wbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <p class="wprog">Copying ${imp.done} of ${imp.total}…</p>`;
  } else
    body = imp.ok
      ? `<b>Your history is in.</b><p class="wok">Everything was copied and checked. Your old folder wasn't changed; once you're happy you can delete it yourself.</p>
         ${c.window ? `<p>Your theme and other window settings come across the next time ArcVault starts.</p>` : ""}
         <details><summary>Show the report</summary><pre>${esc(imp.report || "")}</pre></details>`
      : `<b>Some files couldn't be copied.</b><p class="werr">Nothing is lost: your old folder is untouched. The report says which files and why.</p>
         <details open><summary>Show the report</summary><pre>${esc(imp.report || "")}</pre></details>
         <div class="wbtns"><button type="button" class="btn" id="w-imp-go">Try again</button></div>`;
  return `<div class="wimport">${body}</div>`;
}
async function planFor(src) {
  imp = { state: "planning", src }; rw();
  const r = await window.pywebview.api.import_plan(src);
  imp = r.ok ? { state: "ready", src, plan: r } : { state: "error", src, error: r.error };
  rw();
}
async function chooseImport() {
  const p = await window.pywebview.api.pick_folder("Choose your old ArcVault folder");
  if (p) planFor(p);
}
async function startImport() {
  const r = await window.pywebview.api.import_start(imp.src);
  if (!r.ok) { imp = { ...imp, state: "error", error: r.error }; return rw(); }
  imp = { ...imp, state: "running", done: 0, total: (imp.plan || {}).total || 0 }; rw();
  pollImport();
}
async function pollImport() {
  const st = await window.pywebview.api.import_status();
  if (st.running) { imp.done = st.done || 0; imp.total = st.total || imp.total; rw(); return setTimeout(pollImport, 400); }
  imp = { ...imp, state: "done", ok: !!st.ok, report: st.report || st.error || "" };
  rw();
  if (st.ok && await loadFromApp()) toast("Your history is in. Your old folder wasn't changed (report: import_report.txt).");
}
async function changePlace() {
  const p = await window.pywebview.api.pick_folder("Choose where ArcVault keeps your files");
  if (!p) return;
  const r = await window.pywebview.api.set_data_dir(p);
  if (!r.ok) return toast(r.error);
  appWhere = r; applyNames();
  toast(`Your files will be kept in ${r.data_dir}`);
  if (imp.src && (imp.state === "ready" || imp.state === "error")) planFor(imp.src); else rw();
}

// ---------- the big auto-export switch (ArcVault window only) ----------
let swBusy = false, swLastOk = null, lastStatus = null;
const ago = t => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const inMin = (t, now) => { const m = Math.max(0, Math.ceil((t - now) / 60)); return m <= 1 ? "in under a minute" : `in ${m} min`; };
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function renderSwitch(st) {
  lastStatus = st;
  const sw = $("sw"), txt = $("sw-state"), one = st.oneoff || {};
  const now = st.now || Date.now() / 1000;
  const lastOk = Math.max(st.last_ok || 0, one.done_at || 0) || null;
  const lastRes = (one.done_at || 0) > (st.last_ok || 0) ? one.result : st.last_result;
  const freshErr = one.error && one.error_at && now - one.error_at < 120;
  let cls = "", text = "Off · nothing runs", tip = "Turn on to export your collection automatically while Arena is open.";
  if (one.running) { cls = "exporting"; text = "Exporting now…"; tip = one.step || "Reading your collection from Arena."; }
  else if (!st.on) {
    if (freshErr) { cls = "retry"; text = "Export didn't run"; tip = one.error; }
    else if (one.done_at) { text = `Off · exported ${ago(one.done_at)}${one.result ? " · " + one.result : ""}`; }
  } else {
    if (!st.arena) {
      cls = "waiting"; text = "On · waiting for Arena";
      tip = "Exports start when Arena opens: the first a few minutes after it starts, then every 15 minutes." + (lastOk ? ` Last export ${clock(lastOk)}.` : "");
    } else if (st.state === "exporting") { cls = "exporting"; text = "Exporting now…"; tip = "Reading your collection from Arena."; }
    else if (st.state === "retry") { cls = "retry"; text = `${st.note ? st.note[0].toUpperCase() + st.note.slice(1) : "Waiting"} · trying again ${st.next_export ? inMin(st.next_export, now) : "soon"}`; tip = "ArcVault never exports mid-match or while Arena is loading."; }
    else if (st.last_ok && st.last_ok > (st.started || 0)) { cls = "done"; text = `Exported ${ago(st.last_ok)}${st.last_result ? " · " + st.last_result : ""}`; tip = st.next_export ? `Next export ${inMin(st.next_export, now)} (${clock(st.next_export)}).` : ""; }
    else if (st.state === "running") { cls = "done"; text = "On"; tip = "Switch off and on once to see more detail here."; }
    else { cls = "soon"; text = st.next_export ? `Arena open · exporting ${inMin(st.next_export, now)}` : "Arena open"; tip = "The first export waits a few minutes so Arena can finish loading."; }
  }
  sw.setAttribute("aria-checked", st.on ? "true" : "false");
  sw.className = "sw" + (cls && st.on ? " st-" + cls : "");     // the switch itself only colours when on
  txt.className = "swstate" + (cls ? " st-" + cls : "");
  if (txt.textContent !== text) { txt.textContent = text; fitRail(); }
  $("autosw").title = tip;
  const busy = one.running || st.state === "exporting";
  setMarkBusy(busy, st.arena);
  $("sw-startup").checked = !!st.startup;
  // a fresh export finished: load it straight away
  if (lastOk && swLastOk !== null && lastOk > swLastOk) loadFromApp(true).then(ok => ok && toast(`Updated: ${lastRes || "export done"}`));
  if (lastOk) swLastOk = lastOk; else if (swLastOk === null) swLastOk = 0;
  if (document.body.classList.contains("welcome")) renderWelcome();
}
function fitRail() {
  const rail = $("sw-rail"), t = $("sw-state");
  rail.classList.remove("moving");
  const over = t.scrollWidth - rail.clientWidth;
  if (over > 2) { rail.style.setProperty("--shift", `-${over + 10}px`); rail.style.setProperty("--rail-s", `${Math.max(4, (over + 10) / 18)}s`); rail.classList.add("moving"); }
}
// the logo glows yellow-white while an export runs, flashes white when it finishes, then fades
let markWasBusy = false, markFlashT = null;
function setMarkBusy(busy, arena) {
  const mb = $("markbtn");
  mb.title = busy ? "Exporting…" : arena ? "Export now" : "Export now (open MTG Arena first)";
  const body = document.body.classList;
  if (busy) { clearTimeout(markFlashT); mb.classList.remove("flash"); body.remove("exportdone"); mb.classList.add("busy"); body.add("exporting"); }
  else if (markWasBusy) {
    mb.classList.remove("busy"); body.remove("exporting");
    mb.classList.add("flash"); body.add("exportdone");
    markFlashT = setTimeout(() => { mb.classList.remove("flash"); body.remove("exportdone"); }, 450);
  }
  markWasBusy = busy;
}
async function exportNow() {
  const r = await window.pywebview.api.auto_now();
  if (r) renderSwitch(r);
  toast(r && r.ok ? "Exporting now…" : (r && r.message) || "Couldn't start an export");
}
async function pollSwitch() {
  if (!swBusy) try { renderSwitch(await window.pywebview.api.auto_status()); } catch (e) { /* closing */ }
  setTimeout(pollSwitch, 4000);
}
function initSwitch() {
  $("sw").onclick = async () => {
    if (swBusy) return;
    const on = $("sw").getAttribute("aria-checked") !== "true";
    swBusy = true; $("sw").disabled = true; $("sw-state").textContent = on ? "Turning on…" : "Turning off…"; fitRail();
    try { renderSwitch(await window.pywebview.api.auto_set(on)); toast(on ? "Auto-export on" : "Auto-export off"); }
    catch (e) { toast("Couldn't change auto-export: " + e); }
    swBusy = false; $("sw").disabled = false;
  };
  const mb = $("markbtn");
  mb.tabIndex = 0; mb.setAttribute("aria-label", "Export now");
  mb.onclick = async () => {
    if (mb.classList.contains("busy")) return toast("Already exporting…");
    if (lastStatus && !lastStatus.arena) return toast("Open MTG Arena first, then press the logo to export.");
    setMarkBusy(true, true);
    await exportNow();
  };
  $("sw-startup").onchange = async e => {
    const r = await window.pywebview.api.startup_set(e.target.checked);
    toast(r.message || ""); renderSwitch(r);
  };
  pollSwitch();
}

// start: in the ArcVault window, the newest export in its folder; in a browser, the last
// loaded file in this browser, else the copy bundled into the page
(async () => {
  if (IN_APP && await appReady()) {
    document.documentElement.classList.add("in-app");
    initSwitch();
    let ok = false;
    try { ok = await loadFromApp(); }
    catch (e) { toast("Couldn't read the export files: " + e); }
    setTimeout(watchApp, ok ? 20000 : 5000);
    if (!ok) render();                                    // first run: the welcome screen
    return;                                               // the window always uses its own folder
  }
  const inv = await bigStore.get("inventory");
  if (inv) loadInventory(inv, false, (await bigStore.get("invName")) || "mtga_inventory.csv");
  const saved = await bigStore.get("csv");
  if (saved) return load(saved, (await bigStore.get("label")) || "Last loaded CSV", false,
    (await bigStore.get("colName")) || "your collection file", await bigStore.get("colWhen"));
  const old = store.get("csv", null);   // saved by the previous version of this page
  if (old) return load(old, store.get("label", "Last loaded CSV"), false, "mtga_collection.csv");
  if (EMBEDDED) return load(EMBEDDED, EMBEDDED_LABEL, false);
  render();
})();
</script>
